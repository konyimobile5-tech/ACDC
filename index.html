<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB 5.1V Bypass Capacitor Animation - AC/DC Filtering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Padauk', 'Noto Sans Myanmar', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', 'Padauk', 'Noto Sans Myanmar', sans-serif;
            user-select: none;
            background-color: #070a12;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 450px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Area -->
    <main class="max-w-4xl w-full flex flex-col">
        
        <!-- Main Circuit Simulation Card -->
        <div class="relative bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            
            <!-- Main Interactive Circuit Canvas Container -->
            <div class="canvas-container bg-white flex items-center justify-center">
                <canvas id="circuitCanvas"></canvas>
            </div>

            <!-- Operating Mode Selection Buttons (DC, AC, DC+AC) -->
            <div class="p-3 bg-slate-900 border-t border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button id="btnModeDC" onclick="setMode('dc')" class="flex items-center justify-center space-x-2 px-3 py-3 rounded-xl text-xs sm:text-sm font-bold border transition-all duration-200 bg-cyan-500/10 border-cyan-500/60 text-cyan-300 hover:bg-cyan-500/20 shadow-lg shadow-cyan-500/10">
                    <i class="fa-solid fa-minus text-cyan-400"></i>
                    <span>1. DC သီးသန့် (5.1V)</span>
                </button>
                <button id="btnModeAC" onclick="setMode('ac')" class="flex items-center justify-center space-x-2 px-3 py-3 rounded-xl text-xs sm:text-sm font-bold border transition-all duration-200 bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-750">
                    <i class="fa-solid fa-wave-square text-red-400"></i>
                    <span>2. AC Noise (AC သီးသန့်)</span>
                </button>
                <button id="btnModeCombined" onclick="setMode('combined')" class="flex items-center justify-center space-x-2 px-3 py-3 rounded-xl text-xs sm:text-sm font-bold border transition-all duration-200 bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-750">
                    <i class="fa-solid fa-layer-group text-amber-400"></i>
                    <span>3. DC + AC (လက်တွေ့ အခြေအနေ)</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Main Rendering Script -->
    <script>
        let currentMode = 'dc'; // 'dc', 'ac', 'combined'
        const simSpeed = 1.0;
        const noiseAmp = 0.8;
        const noiseFreq = 100;

        let lastTime = performance.now();

        const circuitCanvas = document.getElementById('circuitCanvas');
        const ctx = circuitCanvas.getContext('2d');

        let layout = {
            width: 0, height: 0,
            usbX: 0, usbY: 0, usbW: 0, usbH: 0,
            wireY: 0, junctionX: 0,
            icX: 0, icY: 0, icW: 0, icH: 0,
            capTopY: 0, capBotY: 0, gndY: 0
        };

        function drawRoundRect(c, x, y, w, h, r) {
            c.beginPath();
            if (c.roundRect) {
                c.roundRect(x, y, w, h, r);
            } else {
                c.moveTo(x + r, y);
                c.lineTo(x + w - r, y);
                c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r);
                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h);
                c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r);
                c.quadraticCurveTo(x, y, x + r, y);
                c.closePath();
            }
        }

        let particles = [];
        let blockedParticles = [];

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.size = type === 'dc' ? 4.5 : 3.5;
                this.speed = (type === 'dc' ? 2.5 : 3.2) * (0.85 + Math.random() * 0.3);
                this.state = 'main';
                this.phase = Math.random() * Math.PI * 2;
                this.alpha = 1.0;
                this.offsetY = 0;
            }

            update(dt) {
                const dist = this.speed * simSpeed * dt * 60;

                if (this.type === 'ac') {
                    this.phase += dt * (noiseFreq / 15) * simSpeed;
                    this.offsetY = Math.sin(this.phase) * (noiseAmp * 6);
                }

                if (this.state === 'main') {
                    this.x += dist;

                    if (this.x >= layout.junctionX) {
                        if (this.type === 'ac') {
                            this.state = 'cap_down';
                            this.x = layout.junctionX;
                        } else if (this.type === 'dc') {
                            this.state = 'to_ic';
                            if (Math.random() < 0.12) {
                                createBlockedDCParticle(layout.junctionX, layout.wireY);
                            }
                        }
                    }
                } else if (this.state === 'to_ic') {
                    this.x += dist;
                    if (this.x >= layout.icX) return false;
                } else if (this.state === 'cap_down') {
                    this.y += dist;
                    if (this.y >= layout.gndY) return false;
                }

                return true;
            }

            draw(c) {
                c.save();
                c.globalAlpha = this.alpha;

                let drawX = this.x;
                let drawY = this.y + this.offsetY;

                if (this.state === 'cap_down') {
                    drawX = this.x + this.offsetY;
                    drawY = this.y;
                }

                c.beginPath();
                c.arc(drawX, drawY, this.size, 0, Math.PI * 2);

                if (this.type === 'dc') {
                    c.fillStyle = '#0284c7';
                    c.shadowColor = '#38bdf8';
                    c.shadowBlur = 6;
                } else {
                    c.fillStyle = '#dc2626';
                    c.shadowColor = '#ef4444';
                    c.shadowBlur = 6;
                }

                c.fill();
                c.restore();
            }
        }

        function createBlockedDCParticle(x, y) {
            blockedParticles.push({
                x: x,
                y: y,
                alpha: 1.0,
                speed: 1.2 * simSpeed
            });
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const cContainer = circuitCanvas.parentElement;
            const cWidth = cContainer.clientWidth;
            const cHeight = cContainer.clientHeight;

            circuitCanvas.width = cWidth * dpr;
            circuitCanvas.height = cHeight * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            layout = {
                width: cWidth,
                height: cHeight,
                usbX: cWidth * 0.12,
                usbY: cHeight * 0.18,
                usbW: cWidth * 0.08,
                usbH: cHeight * 0.58,
                wireY: cHeight * 0.38,
                junctionX: cWidth * 0.50,
                icX: cWidth * 0.72,
                icY: cHeight * 0.15,
                icW: cWidth * 0.18,
                icH: cHeight * 0.62,
                capTopY: cHeight * 0.54,
                capBotY: cHeight * 0.64,
                gndY: cHeight * 0.80
            };
        }

        let spawnTimer = 0;
        function handleParticleSpawning(dt) {
            spawnTimer += dt * simSpeed;
            if (spawnTimer >= 0.07) {
                spawnTimer = 0;
                const startX = layout.usbX + layout.usbW;
                const startY = layout.wireY;

                if (currentMode === 'dc') {
                    particles.push(new Particle('dc', startX, startY));
                } else if (currentMode === 'ac') {
                    particles.push(new Particle('ac', startX, startY));
                } else if (currentMode === 'combined') {
                    particles.push(new Particle('dc', startX, startY));
                    particles.push(new Particle('ac', startX, startY));
                }
            }
        }

        function drawCircuit() {
            const w = layout.width;
            const h = layout.height;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            const gridSize = 24;
            for (let x = 0; x < w; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = 0; y < h; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            // Blue Main Power Wire Trace with Arrowhead
            ctx.save();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            ctx.moveTo(layout.usbX + layout.usbW, layout.wireY);
            ctx.lineTo(layout.icX, layout.wireY);
            ctx.stroke();

            const arrowSize = 9;
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.moveTo(layout.icX, layout.wireY);
            ctx.lineTo(layout.icX - arrowSize, layout.wireY - arrowSize * 0.6);
            ctx.lineTo(layout.icX - arrowSize, layout.wireY + arrowSize * 0.6);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(layout.junctionX, layout.wireY);
            ctx.lineTo(layout.junctionX, layout.gndY);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(layout.junctionX, layout.wireY, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#1d4ed8';
            ctx.fill();

            // USB Connector
            ctx.save();
            const uX = layout.usbX;
            const uY = layout.usbY;
            const uW = layout.usbW;
            const uH = layout.usbH;

            ctx.fillStyle = '#3b82f6';
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 2;
            drawRoundRect(ctx, uX, uY, uW, uH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 16px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('5.1 V', uX + uW + 10, layout.wireY - 10);

            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 15px Inter, Padauk, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('USB Connector', uX + uW / 2, uY + uH + 28);
            ctx.restore();

            // Charging IC
            ctx.save();
            const icX = layout.icX;
            const icY = layout.icY;
            const icW = layout.icW;
            const icH = layout.icH;

            ctx.fillStyle = '#ef4444';
            ctx.strokeStyle = '#991b1b';
            ctx.lineWidth = 2.5;
            drawRoundRect(ctx, icX, icY, icW, icH, 20);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('VBus', icX + 12, layout.wireY + 6);

            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 16px Inter, Padauk, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Charging IC', icX + icW / 2, icY + icH + 30);

            ctx.fillStyle = '#dcfce7';
            ctx.font = 'bold 11px Padauk, sans-serif';
            ctx.fillText('✓ 5.1V Clean DC', icX + icW / 2, icY + 24);
            ctx.restore();

            drawCapacitorSymbol(ctx);
            drawGNDSymbol(ctx);
            drawBlockedDCEffect(ctx);
        }

        function drawCapacitorSymbol(c) {
            const cx = layout.junctionX;
            const topY = layout.capTopY;
            const botY = layout.capBotY;
            const plateW = 34;

            c.save();

            c.strokeStyle = '#0f172a';
            c.lineWidth = 4.5;
            c.beginPath();
            c.moveTo(cx - plateW / 2, topY);
            c.lineTo(cx + plateW / 2, topY);
            c.stroke();

            c.beginPath();
            c.moveTo(cx - plateW / 2, botY);
            c.lineTo(cx + plateW / 2, botY);
            c.stroke();

            const gapGrad = c.createLinearGradient(0, topY, 0, botY);
            if (currentMode !== 'dc') {
                gapGrad.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
                gapGrad.addColorStop(1, 'rgba(239, 68, 68, 0.05)');
            } else {
                gapGrad.addColorStop(0, 'rgba(2, 132, 199, 0.25)');
                gapGrad.addColorStop(1, 'rgba(2, 132, 199, 0.02)');
            }
            c.fillStyle = gapGrad;
            c.fillRect(cx - plateW / 2, topY + 2, plateW, botY - topY - 4);

            c.fillStyle = '#0f172a';
            c.font = 'bold 13px Inter, sans-serif';
            c.textAlign = 'left';
            c.fillText('C (10µF)', cx + plateW / 2 + 10, (topY + botY) / 2 - 2);
            c.font = '10px Padauk, sans-serif';
            c.fillStyle = '#64748b';
            c.fillText('Bypass Cap', cx + plateW / 2 + 10, (topY + botY) / 2 + 12);

            c.fillStyle = '#d97706';
            c.font = 'bold 10px Padauk, sans-serif';
            c.textAlign = 'right';
            c.fillText('DC ဘလောက်တားသည် ⛔', cx - plateW / 2 - 8, (topY + botY) / 2 + 3);

            c.restore();
        }

        function drawGNDSymbol(c) {
            c.save();
            const gx = layout.junctionX;
            const gy = layout.gndY;

            c.strokeStyle = '#0f172a';
            c.lineWidth = 2.5;

            c.beginPath();
            c.moveTo(gx - 18, gy);
            c.lineTo(gx + 18, gy);

            c.moveTo(gx - 11, gy + 5);
            c.lineTo(gx + 11, gy + 5);

            c.moveTo(gx - 5, gy + 10);
            c.lineTo(gx + 5, gy + 10);
            c.stroke();

            c.fillStyle = '#334155';
            c.font = 'bold 12px Inter, Padauk, sans-serif';
            c.textAlign = 'center';
            c.fillText('GND (0V)', gx, gy + 24);
            c.restore();
        }

        function drawBlockedDCEffect(c) {
            for (let i = blockedParticles.length - 1; i >= 0; i--) {
                const p = blockedParticles[i];
                p.y += p.speed;

                if (p.y >= layout.capTopY - 2) {
                    p.alpha -= 0.05;
                }

                if (p.alpha <= 0) {
                    blockedParticles.splice(i, 1);
                    continue;
                }

                c.save();
                c.globalAlpha = p.alpha;
                c.fillStyle = '#0284c7';
                c.beginPath();
                c.arc(p.x, p.y, 3, 0, Math.PI * 2);
                c.fill();

                if (p.y >= layout.capTopY - 4) {
                    c.strokeStyle = '#dc2626';
                    c.lineWidth = 1.5;
                    c.beginPath();
                    c.moveTo(p.x - 4, p.y - 4);
                    c.lineTo(p.x + 4, p.y + 4);
                    c.moveTo(p.x + 4, p.y - 4);
                    c.lineTo(p.x - 4, p.y + 4);
                    c.stroke();
                }

                c.restore();
            }
        }

        function animate(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            handleParticleSpawning(dt);

            for (let i = particles.length - 1; i >= 0; i--) {
                const keep = particles[i].update(dt);
                if (!keep) particles.splice(i, 1);
            }

            drawCircuit();

            for (let p of particles) {
                p.draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        function setMode(mode) {
            currentMode = mode;
            particles = [];
            blockedParticles = [];

            const btnDC = document.getElementById('btnModeDC');
            const btnAC = document.getElementById('btnModeAC');
            const btnComb = document.getElementById('btnModeCombined');

            const activeClass = "flex items-center justify-center space-x-2 px-3 py-3 rounded-xl text-xs sm:text-sm font-bold border transition-all duration-200 bg-cyan-500/10 border-cyan-500/60 text-cyan-300 shadow-lg shadow-cyan-500/10";
            const inactiveClass = "flex items-center justify-center space-x-2 px-3 py-3 rounded-xl text-xs sm:text-sm font-bold border transition-all duration-200 bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-750";

            btnDC.className = (mode === 'dc') ? activeClass : inactiveClass;
            btnAC.className = (mode === 'ac') ? activeClass : inactiveClass;
            btnComb.className = (mode === 'combined') ? activeClass : inactiveClass;
        }

        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setMode('dc');
            requestAnimationFrame(animate);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
